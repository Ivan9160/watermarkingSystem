
worker_processes 1;

pid nginx/logs/nginx.pid;
error_log nginx/logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    access_log nginx/logs/access.log;

    sendfile on;

    client_body_temp_path nginx/temp/client_body_temp;
    proxy_temp_path nginx/temp/proxy_temp;
    fastcgi_temp_path nginx/temp/fastcgi_temp;
    uwsgi_temp_path nginx/temp/uwsgi_temp;
    scgi_temp_path nginx/temp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 127.0.0.1:443 ssl;
        server_name localhost;

        ssl_certificate ../.local-certs/localhost.pem;
        ssl_certificate_key ../.local-certs/localhost-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 25m;

        # NestJS API
        location = /api {
            return 301 /api/;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # Frontend
        location / {
            proxy_pass http://127.0.0.1:5173;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 127.0.0.1:80;
        server_name localhost;

        return 301 https://localhost$request_uri;
    }
}
